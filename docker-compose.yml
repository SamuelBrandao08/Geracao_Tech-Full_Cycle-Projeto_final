services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    ports:
      # Exposto apenas em 127.0.0.1 para os testes de integração locais (deno task test)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build: .
    ports:
      - "8000:3000"
    environment:
      # Usa o hostname "postgres" (rede interna do Compose), independente do localhost do .env
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SIGNING_KEY_ID: ${SIGNING_KEY_ID:-key-2026-01}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: