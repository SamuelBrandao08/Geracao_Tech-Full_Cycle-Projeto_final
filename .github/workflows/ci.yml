name: CI — Projeto B (Biblioteca + Carteirinha Digital)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-and-tests:
    name: Lint, Type Check & Tests (96%+ Coverage)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: biblioteca
          POSTGRES_PASSWORD: biblioteca_ci_password
          POSTGRES_DB: biblioteca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U biblioteca -d biblioteca_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgres://biblioteca:biblioteca_ci_password@localhost:5432/biblioteca_test
      LOG_LEVEL: silent
      SIGNING_KEY_ID: key-2026-ci

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verificar formatação (deno fmt --check)
        run: deno fmt --check

      - name: Executar linter (deno lint)
        run: deno lint

      - name: Verificar tipos (deno task check)
        run: deno task check

      - name: Executar testes unitários, integração e cobertura
        run: deno task test
